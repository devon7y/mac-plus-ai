<?xml version="1.0"?>
<!-- The Mac Plus keyboard has no Esc key. Map the host's Esc to the Plus's ` key as well, so games
     can use Esc to quit (they read Mac key code 0x32 on the Plus, 0x35 on the SE's ADB keyboard).
     Used by emu/play.sh and emu/run_mac.sh via -ctrlrpath emu/ctrlr -ctrlr esc. -->
<mameconfig version="10">
    <system name="macplus">
        <input>
            <port tag=":kbd:usp:ROW8" type="KEYBOARD" mask="64" defvalue="64">
                <newseq type="standard">KEYCODE_TILDE OR KEYCODE_ESC</newseq>
            </port>
        </input>
    </system>
</mameconfig>
